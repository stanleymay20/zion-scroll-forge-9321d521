name: Production Deployment

# Per-push production quality gate. Lovable may publish from main, so this
# workflow must fail closed on security, academic-authority, financial-authority,
# signup-provisioning, skill-evidence authority, role authority, maintenance,
# storage authority, operational invariants, content authority, curriculum
# completeness authority, SUYAS academic-year authority, type-check, build,
# and browser E2E regressions before a SHA is treated as release-ready.
# Historical Supabase migrations still contain bootstrap drift; those are logged
# advisory while current launch boundaries are replayed blocking.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (CRITICAL BLOCKING)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: archive
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret

      - name: Generate Trivy SARIF for GitHub Security
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: archive
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          scanners: vuln,secret

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Run Snyk security scan advisory
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then echo "SNYK_TOKEN not configured; skipping Snyk scan"; exit 0; fi
          npx snyk test --severity-threshold=critical

  backend-tests:
    name: Backend SQL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrolltest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: scrolltest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision roles + extensions + auth + storage stubs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE anon NOLOGIN;
            CREATE ROLE authenticated NOLOGIN;
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
            CREATE ROLE supabase_auth_admin NOLOGIN;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE SCHEMA IF NOT EXISTS extensions;
            CREATE SCHEMA IF NOT EXISTS storage;
            CREATE TABLE IF NOT EXISTS auth.users (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              email text,
              created_at timestamptz DEFAULT now()
            );
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
              SELECT nullif(current_setting('request.jwt.claims', true)::json->>'sub','')::uuid
            $$;
            CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$
              SELECT coalesce(current_setting('request.jwt.claims', true)::json->>'role','anon')
            $$;
            CREATE TABLE IF NOT EXISTS storage.buckets (
              id text PRIMARY KEY,
              name text NOT NULL,
              public boolean NOT NULL DEFAULT false,
              file_size_limit bigint,
              allowed_mime_types text[]
            );
            CREATE TABLE IF NOT EXISTS storage.objects (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              bucket_id text NOT NULL,
              name text NOT NULL,
              owner_id text
            );
            ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
            CREATE OR REPLACE FUNCTION storage.foldername(path text) RETURNS text[]
            LANGUAGE sql IMMUTABLE AS $$
              SELECT CASE
                WHEN position('/' in path) = 0 THEN ARRAY[]::text[]
                ELSE string_to_array(regexp_replace(path, '/[^/]*$', ''), '/')
              END
            $$;
          SQL

      - name: Apply historical Supabase migrations (bootstrap advisory)
        run: |
          set -e
          mkdir -p /tmp/mig-logs
          fail_count=0
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            base="$(basename "$f")"
            case "$base" in
              20260907175900_suyas_calendar_substrate_reconciliation.sql|20260907180000_suyas_academic_year_authority.sql|20260907180100_suyas_rollover_compatibility.sql)
                echo "↷ deferred current SUYAS truth-boundary: $f"
                continue
                ;;
            esac
            log="/tmp/mig-logs/$base.log"
            if psql -v ON_ERROR_STOP=1 -f "$f" >"$log" 2>&1; then echo "✓ $f"; else
              fail_count=$((fail_count+1))
              echo "::warning file=$f::Historical migration did not apply in vanilla Postgres bootstrap"
              tail -n 12 "$log" || true
            fi
          done
          echo "Migration bootstrap attempted; historical failures: $fail_count"

      - name: Enforce learning-currency retirement migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828151500_retire_learning_currency.sql
      - name: Enforce launch academic authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828160000_launch_academic_authority_boundary.sql
      - name: Enforce launch financial authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828163000_launch_financial_authority_boundary.sql
      - name: Enforce signup provisioning authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828170500_signup_provisioning_without_learning_currency.sql
      - name: Enforce live skill-evidence authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828193000_live_skill_evidence_authority_boundary.sql
      - name: Enforce launch role authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828201500_launch_role_authority_boundary.sql
      - name: Enforce launch maintenance authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828203000_launch_maintenance_authority_boundary.sql
      - name: Enforce launch operational invariants (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828204500_launch_operational_invariants.sql
      - name: Enforce launch storage authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828210000_launch_storage_authority_boundary.sql
      - name: Enforce academic credit truth migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907100000_scrolluniversity_credit_truth.sql
      - name: Enforce course teaching readiness migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907101000_course_teaching_readiness_gate.sql
      - name: Enforce module quiz attempt authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907102000_module_quiz_attempt_authority.sql
      - name: Enforce module content review authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907103000_module_content_review_authority.sql
      - name: Enforce module content authority hardening migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907104000_module_content_authority_hardening.sql
      - name: Enforce module content state fail-closed migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907104100_module_content_state_fail_closed.sql
      - name: Enforce course curriculum completeness authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907113000_course_curriculum_completeness_authority.sql
      - name: Enforce course curriculum completeness hardening migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907113100_course_curriculum_completeness_hardening.sql
      - name: Enforce course curriculum invoker privilege fix (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907113200_course_curriculum_invoker_privilege_fix.sql

      - name: Run signup provisioning suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/signup_provisioning.test.sql
      - name: Run storage authority suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/storage_authority.test.sql
      - name: Run academic credit truth suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/academic_credit_truth.test.sql
      - name: Run course teaching readiness suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/course_teaching_readiness.test.sql
      - name: Run module quiz attempt authority suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/module_quiz_attempt_authority.test.sql
      - name: Run module content authority suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/module_content_authority.test.sql
      - name: Run course curriculum completeness authority suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/course_curriculum_completeness_authority.test.sql
      - name: Run academic spine regression suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/academic_spine.test.sql
      - name: Seed representative cohort fixtures
        run: |
          if [ -f supabase/tests/fixtures/seed_cohort.sql ]; then
            psql -f supabase/tests/fixtures/seed_cohort.sql || echo "::warning::cohort fixtures partially skipped (expected in bootstrap)"
          fi
      - name: Run lifecycle behavior suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/lifecycle_behavior.test.sql
      - name: Run lifecycle invariants suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/lifecycle_invariants.test.sql
      - name: Run executive scope isolation suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/executive_scope_isolation.test.sql
      - name: Run term rollover suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/term_rollover.test.sql
      - name: Run faculty analytics KPIs suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/faculty_analytics_kpis.test.sql
      - name: Run faculty office hours suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/faculty_office_hours.test.sql
      - name: Run faculty gradebook suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/faculty_gradebook.test.sql
      - name: Run faculty workload planner suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/faculty_workload_planner.test.sql
      - name: Run skill taxonomy suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/skill_taxonomy.test.sql
      - name: Run verified learning security suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/verified_learning_security.test.sql
      - name: Run launch academic authority suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/launch_academic_authority.test.sql
      - name: Run launch financial authority suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/launch_financial_authority.test.sql
      - name: Run launch role authority suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/launch_role_authority.test.sql

      - name: Run governance suite (advisory)
        continue-on-error: true
        run: |
          if [ -f supabase/tests/program_transfer_governance.test.sql ]; then psql -v ON_ERROR_STOP=1 -f supabase/tests/program_transfer_governance.test.sql; fi

      - name: Reconcile SUYAS calendar substrate (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907175900_suyas_calendar_substrate_reconciliation.sql
      - name: Enforce SUYAS academic-year authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907180000_suyas_academic_year_authority.sql
      - name: Enforce SUYAS canonical rollover compatibility (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907180100_suyas_rollover_compatibility.sql
      - name: Run SUYAS academic-year authority suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/suyas_academic_year_authority.test.sql

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Run frontend lint advisory
        continue-on-error: true
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build frontend
        run: npm run build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep release-gate smoke tests disconnected from live data while
      # satisfying the frontend client's required runtime configuration.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: e2e-public-placeholder-key
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install application dependencies
        run: npm ci --legacy-peer-deps
      - name: Install pinned Playwright test runtime
        run: npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build release candidate
        run: npm run build
      - name: Run browser E2E suite
        run: npx playwright test --config=playwright.config.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  release-ready:
    name: Release Ready
    runs-on: ubuntu-latest
    needs: [security-scan, backend-tests, frontend-tests, browser-e2e]
    if: ${{ always() }}
    steps:
      - name: Require every production gate
        env:
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          E2E_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          echo "Security: $SECURITY_RESULT"
          echo "Backend:  $BACKEND_RESULT"
          echo "Frontend: $FRONTEND_RESULT"
          echo "Browser E2E: $E2E_RESULT"
          test "$SECURITY_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          echo "Release-ready gate passed for $GITHUB_SHA"
