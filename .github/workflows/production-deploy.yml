name: Production Deployment

# Per-push production quality gate. The frontend hosting platform may publish
# from main, so this workflow must fail closed on academic/security regressions.
# Historical Supabase migrations still contain bootstrap drift; those are logged
# advisory, while current production truth-boundary migrations and regression
# suites are explicitly blocking below.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (CRITICAL BLOCKING)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Run Snyk security scan advisory
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN not configured; skipping Snyk scan"
            exit 0
          fi
          npx snyk test --severity-threshold=critical

  backend-tests:
    name: Backend SQL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrolltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: scrolltest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Provision roles + extensions + auth stub
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE anon NOLOGIN;
            CREATE ROLE authenticated NOLOGIN;
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
            CREATE ROLE supabase_auth_admin NOLOGIN;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE SCHEMA IF NOT EXISTS extensions;
            CREATE TABLE IF NOT EXISTS auth.users (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              email text,
              created_at timestamptz DEFAULT now()
            );
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
              SELECT nullif(current_setting('request.jwt.claims', true)::json->>'sub','')::uuid
            $$;
            CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$
              SELECT coalesce(current_setting('request.jwt.claims', true)::json->>'role','anon')
            $$;
          SQL

      - name: Apply historical Supabase migrations (bootstrap advisory)
        run: |
          set -e
          mkdir -p /tmp/mig-logs
          fail_count=0
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            log="/tmp/mig-logs/$(basename "$f").log"
            if psql -v ON_ERROR_STOP=1 -f "$f" >"$log" 2>&1; then
              echo "✓ $f"
            else
              fail_count=$((fail_count+1))
              echo "::warning file=$f::Historical migration did not apply in vanilla Postgres bootstrap"
              tail -n 12 "$log" || true
            fi
          done
          echo "Migration bootstrap attempted; historical failures: $fail_count"

      - name: Enforce learning-currency retirement migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828151500_retire_learning_currency.sql

      - name: Enforce launch academic authority migration (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260828160000_launch_academic_authority_boundary.sql

      - name: Run academic spine regression suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/academic_spine.test.sql

      - name: Run lifecycle behavior suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/lifecycle_behavior.test.sql

      - name: Run lifecycle invariants suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/lifecycle_invariants.test.sql

      - name: Run executive scope isolation suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/executive_scope_isolation.test.sql

      - name: Run term rollover suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/term_rollover.test.sql

      - name: Run faculty analytics KPIs suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/faculty_analytics_kpis.test.sql

      - name: Run faculty office hours suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/faculty_office_hours.test.sql

      - name: Run faculty gradebook suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/faculty_gradebook.test.sql

      - name: Run faculty workload planner suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/faculty_workload_planner.test.sql

      - name: Run skill taxonomy suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/skill_taxonomy.test.sql

      - name: Run verified learning security suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/verified_learning_security.test.sql

      - name: Run launch academic authority suite (BLOCKING)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/launch_academic_authority.test.sql

      - name: Run governance suite (advisory)
        continue-on-error: true
        run: |
          if [ -f supabase/tests/program_transfer_governance.test.sql ]; then
            psql -v ON_ERROR_STOP=1 -f supabase/tests/program_transfer_governance.test.sql
          fi

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend lint advisory
        continue-on-error: true
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build frontend
        run: npm run build
